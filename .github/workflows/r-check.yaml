name: R basic check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::janitor

      - name: Check R files load
        run: |
          Rscript -e "files <- list.files(pattern='\\\\.R$', recursive=TRUE); for(f in files) { message('Checking ', f); source(f) }"
